name: PowerVR Android runners

on:
  push:
    branches:
      - powervr-hello-x
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powervr-android-runners-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  package-android-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Android NDK on the build host
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;${NDK_VERSION}" >/dev/null
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Cross-compile and package phone and tablet runners
        shell: bash
        run: |
          set -euo pipefail

          ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist

          shaders=(
            set-pixel-3-rgb-52-39-182.frag
            set-block-32x32-rgb-52-39-182.frag
            dot-vector4-covector4.frag
            dot-vector32-covector32.frag
            subtract-vector8-norm.frag
            rotate-difference8-to-e1.frag
          )

          package_target() {
            local target=$1
            local abi=$2
            local compiler=$3
            local archive=$4
            local stage="dist/stage-${target}"

            rm -rf "$stage"
            mkdir -p "$stage/bin" "$stage/libexec" "$stage/generated" "$stage/share/powervr"

            "$toolchain/$compiler" -std=c11 -O2 -Wall -Wextra \
              tools/powervr_primitives.c \
              -o "$stage/libexec/powervr-primitives" \
              -lEGL -lGLESv3 -lm
            "$toolchain/llvm-strip" "$stage/libexec/powervr-primitives"

            cp tools/accept_powervr_termux.sh "$stage/bin/powervr-accept"
            chmod 0755 "$stage/bin/powervr-accept" "$stage/libexec/powervr-primitives"

            printf '%s\n' "$GITHUB_SHA" > "$stage/share/powervr/source-commit"
            printf '%s\n' "$target" > "$stage/share/powervr/package-target"
            printf '%s\n' "$abi" > "$stage/share/powervr/package-abi"
            : > "$stage/share/powervr/shader-blobs.txt"

            for shader in "${shaders[@]}"; do
              path="generated/$shader"
              expected_blob=$(git rev-parse "$GITHUB_SHA:$path")
              actual_blob=$(git hash-object "$path")
              test "$actual_blob" = "$expected_blob"
              printf 'shader.blob: %s %s\n' "$actual_blob" "$path" \
                >> "$stage/share/powervr/shader-blobs.txt"
              cp "$path" "$stage/generated/$shader"
            done

            (
              cd "$stage"
              sha256sum \
                bin/powervr-accept \
                libexec/powervr-primitives \
                generated/*.frag \
                share/powervr/source-commit \
                share/powervr/package-target \
                share/powervr/package-abi \
                share/powervr/shader-blobs.txt \
                > share/powervr/manifest.sha256
            )

            "$toolchain/llvm-readelf" -h "$stage/libexec/powervr-primitives"
            tar -C "$stage" -czf "dist/$archive" .
            sha256sum "dist/$archive" > "dist/$archive.sha256"
          }

          package_target phone armeabi-v7a armv7a-linux-androideabi21-clang \
            powervr-runner-phone-armeabi-v7a.tar.gz
          package_target tablet arm64-v8a aarch64-linux-android21-clang \
            powervr-runner-tablet-arm64-v8a.tar.gz

          cat dist/*.sha256

      - name: Publish exact-commit Android packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=${GITHUB_SHA:0:12}
          tag="powervr-android-$short"
          assets=(
            dist/powervr-runner-phone-armeabi-v7a.tar.gz
            dist/powervr-runner-phone-armeabi-v7a.tar.gz.sha256
            dist/powervr-runner-tablet-arm64-v8a.tar.gz
            dist/powervr-runner-tablet-arm64-v8a.tar.gz.sha256
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "PowerVR Android runners $short" \
              --notes "Cloud-cross-compiled Android acceptance runners for exact source commit $GITHUB_SHA. Phone and tablet are runtime consumers; this release is packaging evidence, not physical PowerVR execution evidence."
          fi
